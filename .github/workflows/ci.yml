name: ci

# Test gate for seki: fmt check and the workspace tests, run inside the
# flake's default devshell through substrate's nix-devshell-cargo-test.yml.
# The reusable routes the runner by repository visibility.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `cargo fmt --all -- --check` + `cargo test --workspace` inside `.#default`.
  #
  # MEASURED before wiring, because this reusable's own header records a case
  # where it "reached" three consumers and ran the tests of ZERO of them — all
  # three resolved `devShells.<sys>.default` to a devenv shell, which
  # `nix develop` cannot enter non-interactively:
  #
  #   nix eval --raw .#devShells.aarch64-darwin.default.name  ->  nix-shell
  #
  # A plain mkShell, so this leg genuinely executes. (frost, adopting the same
  # reusable in the same pass, measured `devenv-shell` on a stale substrate pin
  # and needed a `nix flake update substrate` first. Re-measure if this flake's
  # builder changes; do not assume.)
  #
  # NO SKIPS AND NO WAIVERS — measured 2026-08-08 on aarch64-darwin at 91f28e1:
  #   cargo test --workspace --no-fail-fast   ->  exit 0
  #   439 passed / 0 failed across 4 suites (299 + 80 + 43 + 17)
  #   cargo fmt --all -- --check              ->  exit 0, clean
  # This is a local run on one platform. It is NOT evidence about the Linux
  # runner this workflow targets — a first-run platform failure is the gate
  # doing its job, not a defect in the shim.
  #
  # `--all-features` is dropped from the reusable's default: seki declares no
  # `[features]` in any member, so it would widen the subject set by zero tests
  # while pulling the full optional dependency graph of `shikumi`.
  #
  # Private git deps: `shikumi` and `ishou` are both PUBLIC, so the reusable's
  # credential step resolves to an empty rewrite — verified harmless (GitHub
  # accepts an empty basic-auth password for public read; `ls-remote` through
  # the same rewrite returns the ref). seki therefore needs no repo-level
  # BOT_PAT, unlike frost.
  cargo-test:
    uses: pleme-io/substrate/.github/workflows/nix-devshell-cargo-test.yml@main
    with:
      runner: ubuntu-24.04
      devshell: default
      test-args: "--workspace --no-fail-fast"
    secrets: inherit
